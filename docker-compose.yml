services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cotizador
      POSTGRES_USER: cotizador
      POSTGRES_PASSWORD: cotizador
    ports:
      # Host 5433 -> contenedor 5432: 5432 ya está tomado por un Postgres nativo de Windows
      # corriendo como servicio, y ambos compitiendo en el mismo puerto rompe la conexión del backend.
      - "5433:5432"
    volumes:
      - cotizador_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cotizador -d cotizador"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./cotizador-backend
    ports:
      - "8080:8080"
    environment:
      # Dentro de la red de compose no hay conflicto de puerto 5432 (eso solo pasa en el host),
      # así que el backend le habla a postgres por el puerto interno del contenedor.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cotizador
      SPRING_DATASOURCE_USERNAME: cotizador
      SPRING_DATASOURCE_PASSWORD: cotizador
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Se hornea en el bundle de cliente (NEXT_PUBLIC_*) — el browser corre en el host,
        # así que necesita el puerto publicado, no el hostname interno de compose.
        NEXT_PUBLIC_API_URL: http://localhost:8080
    ports:
      - "3000:3000"
    environment:
      # Server-side (Server Components) corre dentro de este contenedor: "localhost" ahí
      # apuntaría al contenedor mismo, no al backend — usa el hostname interno de compose.
      # Ver el comentario en frontend/src/lib/api/client.ts (apiBaseUrl()).
      API_URL_INTERNAL: http://backend:8080
    depends_on:
      - backend

volumes:
  cotizador_postgres_data:
